name: Validate and publish dashboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check syntax and test statistics
        run: |
          python -m py_compile 1.Stats.py app_analysis.py opportunity.py build_site.py scanner/marketplaces/*.py
          python -m unittest discover -s tests -v
      - name: Generate static dashboard
        env:
          REFRESH_MARKETS: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$REFRESH_MARKETS" = "true" ]; then
            python build_site.py --refresh
          else
            python build_site.py
          fi
      - name: Preserve successful observations and generated pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main changed during collection; refusing to publish stale source code. Rerun the workflow."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/Marketplaces Data/Stats Data/Analysis HTML
          if ! git diff --cached --quiet; then
            git commit -m "Refresh marketplace observations and static dashboard"
            git push origin HEAD:main
          fi
      - name: Check Pages availability
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pages"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ['GH_TOKEN'], "Accept": "application/vnd.github+json"})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  enabled = json.load(response).get("build_type") == "workflow"
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              enabled = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"enabled={str(enabled).lower()}\n")
          if not enabled:
              message = "Pages is not configured for GitHub Actions. Select GitHub Actions in Settings > Pages, then rerun this workflow. HTML is available in the repository and in the github-pages artifact."
              print(message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(message + '\n')
          PY
      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: HTML

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
