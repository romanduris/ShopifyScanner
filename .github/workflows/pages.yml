name: Validate and publish dashboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check syntax and test statistics
        run: |
          python -m py_compile 1.Stats.py app_analysis.py opportunity.py
          python -m unittest discover -s tests -v
      - name: Generate static dashboard
        run: python 1.Stats.py
      - name: Check Pages availability
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pages"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ['GH_TOKEN'], "Accept": "application/vnd.github+json"})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  enabled = json.load(response).get("build_type") == "workflow"
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              enabled = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"enabled={str(enabled).lower()}\n")
          if not enabled:
              message = "Pages is not configured for GitHub Actions. Select GitHub Actions in Settings > Pages, then rerun this workflow. HTML is available in the repository and in the github-pages artifact."
              print(message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(message + '\n')
          PY
      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: HTML

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
